worker_rlimit_nofile 65536;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx/nginx.pid;

events {
  worker_connections 8192;
  multi_accept on;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 60;
  types_hash_max_size 4096;
  server_tokens off;

  upstream uwsgi_servers {
    server mapproxy:5000;
    keepalive 128;
  }

  # Cache for proxy_pass backends (TileServerGL)
  proxy_cache_path /var/cache/nginx/tile_cache
                   levels=1:2
                   max_size=10g
                   inactive=60m
                   use_temp_path=off
                   keys_zone=backend_proxy_cache:10m;

  # Cache for uwsgi_pass backends (MapProxy)
  uwsgi_cache_path /var/cache/nginx/uwsgi_cache
                   levels=1:2
                   max_size=10g
                   inactive=60m
                   use_temp_path=off
                   keys_zone=backend_uwsgi_cache:10m;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_min_length 256;
  gzip_types
    application/atom+xml
    application/geo+json
    application/javascript
    application/x-javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rdf+xml
    application/rss+xml
    application/vnd.ms-fontobject
    application/wasm
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/eot
    font/otf
    font/ttf
    image/bmp
    image/png
    image/svg+xml
    image/x-icon
    text/cache-manifest
    text/calendar
    text/css
    text/javascript
    text/plain
    text/markdown
    text/vcard
    text/vnd.rim.location.xloc
    text/vtt
    text/x-component
    text/xml;

  # HTTP listener for compatibility
  server {
    listen 8081;
    server_name _;

    location = /mapproxy { return 301 /mapproxy/; }
    location = /tileservergl { return 301 /tileservergl/; }
    location = /links { return 301 /links/; }

    location /mapproxy/ {
      rewrite ^/mapproxy/(.*)$ /$1 break;
      include /etc/nginx/uwsgi_params;
      uwsgi_pass uwsgi_servers;
      uwsgi_param UWSGI_SCHEME $scheme;
      uwsgi_param SCRIPT_NAME /mapproxy;
      uwsgi_param HTTP_X_REAL_IP $remote_addr;
      uwsgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
      uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;

      # MapProxy speaks uwsgi here. Field test showed nginx uwsgi caching can
      # produce empty replies with this container, so keep it disabled.
      # uwsgi_cache backend_uwsgi_cache;
      # uwsgi_cache_valid 200 302 404 1h;
      # uwsgi_cache_key $scheme$request_method$host$request_uri;
      # uwsgi_cache_lock on;
      # uwsgi_cache_use_stale updating error timeout invalid_header http_500 http_503;
      # uwsgi_cache_revalidate on;
      add_header X-Cache-Status $upstream_cache_status always;

      uwsgi_buffering on;
      uwsgi_buffer_size 32k;
      uwsgi_buffers 16 32k;
      uwsgi_busy_buffers_size 64k;
      uwsgi_read_timeout 80s;
      uwsgi_send_timeout 65s;
      uwsgi_connect_timeout 5s;
    }

    location /tileservergl/ {
      proxy_pass http://tileservergl:8080/;

      # Keep the TileServer index uncached while we support both direct debug
      # access and proxied /tileservergl/ access.
      # proxy_cache backend_proxy_cache;
      # proxy_cache_valid 200 302 404 1h;
      # proxy_cache_key $scheme$request_method$host$request_uri;
      # proxy_cache_lock on;
      # proxy_cache_use_stale updating error timeout invalid_header http_500 http_502 http_503 http_504;
      # proxy_cache_revalidate on;
      # proxy_cache_background_update on;
      add_header X-Cache-Status $upstream_cache_status always;

      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;

      proxy_buffering on;
      proxy_buffer_size 32k;
      proxy_buffers 16 32k;
      proxy_busy_buffers_size 64k;
      proxy_read_timeout 80s;
      proxy_send_timeout 65s;
      proxy_connect_timeout 5s;
    }

    location /links/ {
      alias /usr/share/nginx/html/;
      index index.html;
      try_files $uri $uri/ /index.html;
    }

    # TileServerGL emits absolute browser asset/API paths. Make it the root
    # service and keep /tileservergl/ only as a compatibility prefix.
    location / {
      proxy_pass http://tileservergl:8080;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;

      proxy_buffering on;
      proxy_buffer_size 32k;
      proxy_buffers 16 32k;
      proxy_busy_buffers_size 64k;
      proxy_read_timeout 80s;
      proxy_send_timeout 65s;
      proxy_connect_timeout 5s;
    }
  }

  # HTTPS listener (cert-based)
  server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /mapproxy { return 301 /mapproxy/; }
    location = /tileservergl { return 301 /tileservergl/; }
    location = /links { return 301 /links/; }

    location /mapproxy/ {
      rewrite ^/mapproxy/(.*)$ /$1 break;
      include /etc/nginx/uwsgi_params;
      uwsgi_pass uwsgi_servers;
      uwsgi_param UWSGI_SCHEME $scheme;
      uwsgi_param SCRIPT_NAME /mapproxy;
      uwsgi_param HTTP_X_REAL_IP $remote_addr;
      uwsgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
      uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;

      # MapProxy speaks uwsgi here. Field test showed nginx uwsgi caching can
      # produce empty replies with this container, so keep it disabled.
      # uwsgi_cache backend_uwsgi_cache;
      # uwsgi_cache_valid 200 302 404 1h;
      # uwsgi_cache_key $scheme$request_method$host$request_uri;
      # uwsgi_cache_lock on;
      # uwsgi_cache_use_stale updating error timeout invalid_header http_500 http_503;
      # uwsgi_cache_revalidate on;
      add_header X-Cache-Status $upstream_cache_status always;

      uwsgi_buffering on;
      uwsgi_buffer_size 32k;
      uwsgi_buffers 16 32k;
      uwsgi_busy_buffers_size 64k;
      uwsgi_read_timeout 80s;
      uwsgi_send_timeout 65s;
      uwsgi_connect_timeout 5s;
    }

    location /tileservergl/ {
      proxy_pass http://tileservergl:8080/;

      # Keep the TileServer index uncached while we support both direct debug
      # access and proxied /tileservergl/ access.
      # proxy_cache backend_proxy_cache;
      # proxy_cache_valid 200 302 404 1h;
      # proxy_cache_key $scheme$request_method$host$request_uri;
      # proxy_cache_lock on;
      # proxy_cache_use_stale updating error timeout invalid_header http_500 http_502 http_503 http_504;
      # proxy_cache_revalidate on;
      # proxy_cache_background_update on;
      add_header X-Cache-Status $upstream_cache_status always;

      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;

      proxy_buffering on;
      proxy_buffer_size 32k;
      proxy_buffers 16 32k;
      proxy_busy_buffers_size 64k;
      proxy_read_timeout 80s;
      proxy_send_timeout 65s;
      proxy_connect_timeout 5s;
    }

    location /links/ {
      alias /usr/share/nginx/html/;
      index index.html;
      try_files $uri $uri/ /index.html;
    }

    # TileServerGL emits absolute browser asset/API paths. Make it the root
    # service and keep /tileservergl/ only as a compatibility prefix.
    location / {
      proxy_pass http://tileservergl:8080;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;

      proxy_buffering on;
      proxy_buffer_size 32k;
      proxy_buffers 16 32k;
      proxy_busy_buffers_size 64k;
      proxy_read_timeout 80s;
      proxy_send_timeout 65s;
      proxy_connect_timeout 5s;
    }
  }

}
